<script>
const $=id=>document.getElementById(id);const K=new URLSearchParams(location.search).get('k')==='project'?'project':'place';
let sp=null,ALL=[],RT=[],PL=[],me=null,map=null,layer=null,L2=null,cur=null,wid=null,pickMk=null,osmL=null,plL=null,lastQ=null,SEG=new Set(),JQ='',NEARJ=false;const INF={};
const km=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmt=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1).replace('.',',')+' km';
const inPoly=(pt,sh)=>{let c=false;for(let i=0,j=sh.length-1;i<sh.length;j=i++){const[yi,xi]=sh[i],[yj,xj]=sh[j];if((xi>pt[1])!==(xj>pt[1])&&pt[0]<(yj-yi)*(pt[1]-xi)/(xj-xi)+yi)c=!c}return c};
const hasG=p=>p.lat!=null&&p.lng!=null;
const inside=(p,pos)=>!!pos&&hasG(p)&&(Array.isArray(p.shape)&&p.shape.length>=3?inPoly(pos,p.shape):km(pos[0],pos[1],p.lat,p.lng)<=p.radius_m);
const href=(p,v)=>'/v?t='+p.kind+'&n='+encodeURIComponent(p.name)+'&s=qr&pl='+encodeURIComponent(p.id||'')+(hasG(p)?'&g='+p.lat+','+p.lng+(v?'&v=1':''):'');
const CPK='roi_cp',cpGet=()=>{try{return JSON.parse(localStorage.getItem(CPK)||'{}')}catch(e){return{}}},cpSet=id=>{try{const o=cpGet();if(!o[id]){o[id]=1;localStorage.setItem(CPK,JSON.stringify(o))}}catch(e){}};
const ST={estudio:'En estudio',marcha:'En marcha',hecho:'Hecho'};
const oc=()=>me||sp;
const segOf=p=>/ayuntamient|diputaci|generalitat|consell|junta|gobierno|municip|concejal|conselleria/i.test(p.org||'')?'muni':/universi|campus|facultad|colegio|instituto|escuela/i.test(p.org||'')?'uni':'emp';
async function info(p){if(INF[p.id])return INF[p.id];try{const r=await fetch('/api/public?n='+encodeURIComponent(p.name));INF[p.id]=r.ok?await r.json():{}}catch(e){INF[p.id]={}}return INF[p.id]}
async function banner(p){$('ht').textContent='Estás en «'+p.name+'». ¿Cómo ha ido?';$('hb').href=href(p,true);$('hr').href='/sala?t='+p.kind+'&n='+encodeURIComponent(p.name);
 const hi=$('hi');hi.hidden=!p.info;hi.textContent=p.info||'';$('here').hidden=false;const hc=$('hc'),ok=p.cta_url&&/^https:\/\//.test(p.cta_url);hc.hidden=!ok;if(ok){hc.href=p.cta_url;hc.textContent=(p.cta_label||'Abrir')+' ↗'}
 const j=await info(p);if(!cur||cur.id!==p.id)return;
 const hu=$('hu');hu.textContent='';const ups=(j.updates||[]);hu.hidden=!ups.length;
 if(ups.length){const b=document.createElement('b');b.textContent='Tú dijiste, nosotros hicimos';hu.append(b);ups.forEach(u=>{const q=document.createElement('p');if(u.status){const s=document.createElement('span');s.className='st';s.textContent=ST[u.status]||'';q.append(s)}const t=document.createElement('strong');t.textContent=u.title;q.append(t);if(u.body)q.append(' — '+u.body);hu.append(q)})}
 const hp=$('hp');hp.textContent='';hp.hidden=!j.pulse;if(j.pulse){const a=document.createElement('a');a.href='/v?p='+encodeURIComponent(j.pulse.id);a.textContent='Pregunta rápida: '+j.pulse.question;hp.append(a)}}
function itemEl(o){const a=document.createElement('a');a.className='it';a.href=o.href;a.innerHTML='<span class="k"></span><span class="t"><b></b><small></small></span><span class="d"></span>';
 const k=a.firstChild;k.innerHTML=IC(o.ic||'pin',22);if(o.col){k.style.background=o.col+'22';k.style.color=o.col}
 a.querySelector('b').textContent=o.name;a.querySelector('small').textContent=o.sub||'';a.querySelector('.d').textContent=o.d||'';const li=document.createElement('li');li.append(a);return li}
function drawZones(){
  const ul=$('list');ul.textContent='';
  const L=PL.filter(p=>K==='place'||false).map(p=>({p,d:oc()&&hasG(p)?km(oc()[0],oc()[1],p.lat,p.lng):null})).sort((a,b)=>(a.d==null)-(b.d==null)||(a.d!=null&&b.d!=null?a.d-b.d:a.p.name.localeCompare(b.p.name,'es')));
  if(!L.length){const e=document.createElement('li');e.className='empty';e.textContent='Aún no hay zonas Roi aquí. Las organizaciones las añaden desde su panel.';ul.append(e)}
  L.forEach(({p,d})=>{const ins=inside(p,me),li=itemEl({href:href(p,ins),ic:'zone',name:p.name,sub:[p.org,p.description].filter(Boolean).join(' · ')||'Zona Roi',d:ins?'Estás aquí':d!=null?fmt(d):'Opinar'});
    if(p.cta_url&&/^https:\/\//.test(p.cta_url)){const c=document.createElement('a');c.className='cta';c.href=p.cta_url;c.target='_blank';c.rel='noopener';c.textContent=(p.cta_label||'Abrir')+' ↗';li.append(c)}ul.append(li)});
  const near=L.find(x=>inside(x.p,me));const np=near?near.p:null;
  if(np)cpSet(np.id);routes();
  if(!np){cur=null;$('here').hidden=true}else if(!cur||cur.id!==np.id){cur=np;banner(np);if(navigator.vibrate)try{navigator.vibrate(150)}catch(e){}}
}
function drawProj(){
  const ul=$('jlist');ul.textContent='';const o=oc(),q=JQ.toLowerCase();
  let L=PL.filter(p=>(!SEG.size||SEG.has(segOf(p)))&&(!q||(p.name+' '+(p.org||'')+' '+(p.description||'')).toLowerCase().includes(q))).map(p=>({p,d:o&&hasG(p)?km(o[0],o[1],p.lat,p.lng):null}));
  L.sort((a,b)=>NEARJ&&o?((a.d==null)-(b.d==null)||(a.d||0)-(b.d||0)):a.p.name.localeCompare(b.p.name,'es'));
  if(!L.length){const e=document.createElement('li');e.className='empty';e.textContent=PL.length?'Nada con ese filtro. Prueba otra búsqueda.':'Aún no hay proyectos publicados. Las organizaciones los añaden desde su panel.';ul.append(e)}
  L.forEach(({p,d})=>{const hh=Array.isArray(p.hitos)?p.hitos:[],dn=hh.filter(x=>x.s==='hecho').length,sg=segOf(p);
    ul.append(itemEl({href:href(p,false),ic:'spark',col:'#ef7d1a',name:p.name,sub:[p.org,hh.length?dn+' de '+hh.length+' hitos':p.description].filter(Boolean).join(' · '),d:d!=null&&NEARJ?fmt(d):''}))})}
function mapDraw(){
  if(!(L2&&map))return;layer.clearLayers();const pts=[];
  PL.filter(hasG).forEach(p=>{const sh=Array.isArray(p.shape)&&p.shape.length>=3,col=K==='project'?'#ef7d1a':'#1f9d6b';
    const m=(sh?L2.polygon(p.shape,{color:col,fillOpacity:.2}):L2.circle([p.lat,p.lng],{radius:p.radius_m,color:col,fillOpacity:.15})).addTo(layer);
    const a=Object.assign(document.createElement('a'),{href:href(p,false),textContent:p.name+' · valorar'});m.bindPopup(a);(sh?p.shape:[[p.lat,p.lng]]).forEach(x=>pts.push(x))});
  if(me){let mm=3;try{mm=parseInt(localStorage.getItem('roi_mood'),10);if(isNaN(mm))mm=3}catch(e){}L2.marker(me,{icon:L2.divIcon({className:'',html:'<div class="pf" style="border-color:var(--ac)">'+ROI_FACE(mm,34)+'</div>',iconSize:[34,34]})}).addTo(layer)}
  if(sp&&pickMk===null){}
  if(!window.__fit&&pts.length){window.__fit=1;map.fitBounds(pts,{padding:[30,30],maxZoom:17})}}
function draw(){if(K==='place')drawZones();else drawProj();mapDraw()}
function routes(){const ul=$('rts');if(!ul)return;const v=cpGet();ul.textContent='';const R=K==='place'?RT.filter(r=>Array.isArray(r.place_ids)&&r.place_ids.some(id=>ALL.find(p=>p.id===id))):[];$('rh').hidden=!R.length;
 R.forEach(r=>{const pts=r.place_ids.map(id=>ALL.find(p=>p.id===id)).filter(Boolean),dn=pts.filter(p=>v[p.id]).length,li=document.createElement('li'),d=document.createElement('div');d.className='rt';
  const b=document.createElement('b');b.textContent=r.name;const sm=document.createElement('small');sm.textContent=(r.description?r.description+' · ':'')+dn+' de '+pts.length+' puntos';const cp=document.createElement('div');cp.className='cp';
  pts.forEach((p,i)=>{const sp2=document.createElement('span');sp2.className=v[p.id]?'ok':'';sp2.textContent=(v[p.id]?'✓ ':(i+1)+'. ')+p.name;cp.append(sp2)});d.append(b,sm,cp);
  if(dn===pts.length&&r.reward){const rw=document.createElement('p');rw.className='rw';rw.textContent='Premio: '+r.reward;d.append(rw)}
  const a=document.createElement('a');a.className='btn ac rbtn';a.href='/v?t=project&n='+encodeURIComponent('Ruta · '+r.name)+'&s=ruta';a.textContent='Valorar la ruta';d.append(a);li.append(d);ul.append(li)})}
/* Qué hay cerca (OpenStreetMap): comercios, parques, bibliotecas, deporte… con icono y color por tipo */
const OT={restaurant:['food','#e8590c','Restaurante'],cafe:['food','#b8610f','Cafetería'],bar:['food','#c2255c','Bar'],fast_food:['food','#e8590c','Comida rápida'],ice_cream:['food','#c2255c','Heladería'],library:['book','#7048e8','Biblioteca'],pharmacy:['cross','#e03131','Farmacia'],hospital:['cross','#e03131','Hospital'],clinic:['cross','#e03131','Clínica'],university:['cap','#2a7de1','Universidad'],college:['cap','#2a7de1','Centro de estudios'],school:['cap','#2a7de1','Colegio'],townhall:['landmark','#8a5a2b','Ayuntamiento'],post_office:['landmark','#8a5a2b','Correos'],bank:['card','#1c7ed6','Banco'],cinema:['star','#ae3ec9','Cine'],theatre:['star','#ae3ec9','Teatro'],museum:['landmark','#8a5a2b','Museo'],park:['tree','#2f9e44','Parque'],playground:['tree','#2f9e44','Zona de juegos'],pitch:['ball','#e67700','Pista deportiva'],sports_centre:['ball','#e67700','Polideportivo'],fitness_centre:['ball','#e67700','Gimnasio'],swimming_pool:['ball','#1098ad','Piscina'],supermarket:['cart','#0c8599','Supermercado'],mall:['store','#0c8599','Centro comercial'],shop:['store','#0c8599','Tienda'],bus_station:['route','#495057','Estación']};
const OAM='restaurant|cafe|bar|fast_food|ice_cream|library|pharmacy|hospital|clinic|university|college|school|townhall|post_office|bank|cinema|theatre';
async function osm(){const c=window.__me||sp;if(!c||K!=='place')return;if(lastQ&&km(c[0],c[1],lastQ[0],lastQ[1])<150)return;lastQ=c.slice();$('ol').textContent='Buscando lo que hay cerca…';
  const at='(around:600,'+c[0]+','+c[1]+')',q='[out:json][timeout:15];(nwr'+at+'["name"]["amenity"~"^('+OAM+')$"];nwr'+at+'["name"]["leisure"~"^(park|playground|pitch|sports_centre|fitness_centre|swimming_pool)$"];nwr'+at+'["name"]["tourism"="museum"];nwr'+at+'["name"]["shop"~"^(supermarket|mall|clothes|bakery|books|sports|electronics)$"];);out center 70;';
  let j=null;for(const u of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});if(r.ok){j=await r.json();break}}catch(e){}}
  if(!j){$('ol').textContent='No pude consultar el mapa ahora. Inténtalo en un momento.';return}
  const known=new Set(PL.map(p=>p.name.toLowerCase())),seen=new Set();
  const A=(j.elements||[]).map(e=>{const t=e.tags||{},la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon),k=t.amenity||t.leisure||(t.tourism==='museum'?'museum':t.shop==='supermarket'?'supermarket':t.shop==='mall'?'mall':'shop');return{name:t.name,la,lo,k,d:km(c[0],c[1],la,lo)}}).filter(x=>x.la!=null&&!known.has(x.name.toLowerCase())&&!seen.has(x.name.toLowerCase())&&seen.add(x.name.toLowerCase())).sort((a,b)=>a.d-b.d).slice(0,30);

  $('oh').querySelector('small').textContent=A.length?A.length+' cerca · toca para valorar':''}
/* Punto elegido: búsqueda, toque en el mapa o mi ubicación → punto geolocalizado con botón Valorar */
async function pickPoint(pt,label,known){sp=pt;lastQ=null;window.__fit=1;

const anonId=()=>{let a='';try{a=localStorage.getItem('roi_anon')||'';if(!a){a=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));localStorage.setItem('roi_anon',a)}}catch(e){}return a};

function beat(){if(!$('shw')||!$('shw').checked||!window.__me)return;let nk='';try{nk=localStorage.getItem('roi_nick')||''}catch(e){}fetch('/api/near',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({anon_id:anonId(),nick:nk,mood:(()=>{try{return parseInt(localStorage.getItem('roi_mood'),10)||3}catch(e){return 3}})(),lat:window.__me[0],lng:window.__me[1]})}).catch(()=>{})}
function locate(){$('gps').classList.add('on');if(!navigator.geolocation){$('asm').hidden=false;$('asm').textContent='Tu navegador no da la ubicación.';return}
