<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Valoración rápida</title>
<style>:root{--ink:#26331f;--moss:#3f5a3a;--line:#cfd6c2}body{margin:0;font:17px/1.5 system-ui;color:var(--ink);background:#fbf7ec}.w{max-width:560px;margin:0 auto;padding:16px}h1{font-size:24px}.it{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0}.it b{display:block}.it small{color:#4d5c43}.f{display:flex;gap:8px;margin-top:8px}.f button{flex:1;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:24px}.f button.on{border-color:var(--moss);background:#e9efdc}.ok{color:var(--moss);font-weight:700}</style></head><body><div class="w">
<h1>Valoración rápida</h1><p>Pon tu opinión sincera sobre cada web o lugar que conozcas y salta el resto. Cada toque se guarda como valoración tuya.</p><div id="l"></div></div>
<script>
const T=[['web','upv.es','Web de la Universitat Politècnica de València'],['web','uv.es','Web de la Universitat de València'],['web','valencia.es','Web del Ayuntamiento de València'],['web','torrent.es','Web del Ayuntamiento de Torrent'],['web','mislata.es','Web del Ayuntamiento de Mislata'],['web','paterna.es','Web del Ayuntamiento de Paterna'],
['place','Plaza del Ayuntamiento · Valencia','Lugar',39.4699,-0.3774],['place','Jardín del Turia · Gulliver','Lugar',39.4625,-0.3590],['place','Parque de Cabecera','Lugar',39.4695,-0.4017],['place','Mercado Central · Valencia','Lugar',39.4743,-0.3790],['place','Mercado de Ruzafa','Lugar',39.4600,-0.3736],['place','Mercado de Colón','Lugar',39.4693,-0.3688],['place','UPV · Campus de Vera','Lugar',39.4812,-0.3411],['place','Universitat de València · Blasco Ibáñez','Lugar',39.4786,-0.3640],['place','Playa de la Malvarrosa','Lugar',39.4770,-0.3240]];
const F=['😠','🙁','😐','🙂','😄'],FE=['Enfado','Decepción','Indiferencia','Bienestar','Entusiasmo'];let A='';try{A=localStorage.getItem('roi_anon')||'';if(!A){A=crypto.randomUUID();localStorage.setItem('roi_anon',A)}}catch(e){A='rapido-'+Date.now()}
const L=document.getElementById('l');
T.forEach((t,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML='<b></b><small></small><div class="f"></div>';d.children[0].textContent=t[1];d.children[1].textContent=t[2];
 F.forEach((e,k)=>{const b=document.createElement('button');b.textContent=e;b.setAttribute('aria-label',FE[k]);b.onclick=async()=>{[...d.querySelectorAll('button')].forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const body={client_id:'rapido-'+A.slice(0,8)+'-'+i,anon_id:A,source:'link',type:t[0],subject:t[1],site:t[0]==='web'?t[1]:null,rating:k+1,feeling:FE[k],place_name:t[0]==='place'?t[1]:null,lat:t[3]??null,lng:t[4]??null,lang:'es'};
  try{const r=await fetch('/api/ratings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let m=d.querySelector('.ok');if(!m){m=document.createElement('div');m.className='ok';d.append(m)}m.textContent=r.ok?'✓ Guardada':'No se pudo guardar'}catch(e){}};d.lastChild.append(b)});L.append(d)});
</script></body></html>
